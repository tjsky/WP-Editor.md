name: Release

# 为什么用 GitHub Actions 而不是提交本地构建产物：
#   本仓库的 .gitignore 忽略了 vendor/、所有 *.min.js / *.min.css、languages/*.mo
#   与 Vue 子项目的 html/ 产物。这些是「运行期必需但不宜入库」的东西 ——
#   直接安装 GitHub 源码包会因缺少 vendor/autoload.php 而致命报错。
#   因此由 CI 从源码干净构建，产出的 zip 才可安装，且过程可复现、可追溯。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 10.3.0，需与插件头 Version 一致）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$V"

      # 为什么单独校验插件头：
      #   后台「插件 → 上传插件」界面显示的版本 / 作者 / 所需 WP / 所需 PHP，
      #   以及 update 检查依赖的 Version，都来自插件主文件的头部注释。
      #   这些行形态上与注释续行一模一样（都以 " * " 开头），一旦被格式化工具
      #   或注释清理脚本误删，语法校验与 token 流比对**都发现不了**
      #   （注释本就被排除在 token 比对之外），但用户在后台会直接看到字段缺失。
      #   2026-10-05 的 10.3.0 / 10.4.0 就踩过这个坑，故在此设闸。
      - name: 校验插件头元数据
        env:
          EXPECT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          text = open("wp-editormd.php", encoding="utf-8").read()
          m = re.search(r"/\*\*(.*?)\*/", text, re.S)
          if not m:
              sys.exit("未找到插件主文件的头部注释块")

          header = {}
          for line in m.group(1).splitlines():
              mm = re.match(r"^\s*\*+\s*([A-Za-z][A-Za-z ]*?)\s*:\s*(\S.*?)\s*$", line)
              if mm:
                  header[mm.group(1)] = mm.group(2)

          print("插件头字段：")
          for k, v in header.items():
              print("  %-20s %s" % (k, v))

          required = [
              "Plugin Name", "Version", "Author",
              "Requires at least", "Requires PHP", "Tested up to",
          ]
          missing = [f for f in required if not header.get(f)]
          if missing:
              sys.exit("插件头缺少必需字段：%s" % "、".join(missing))

          expect = os.environ["EXPECT_VERSION"]
          if header["Version"] != expect:
              sys.exit("插件头 Version=%s，与本次构建版本 %s 不一致"
                       % (header["Version"], expect))

          print("插件头元数据校验通过（Version=%s）" % expect)
          PY

      # 安全不变量：防止「已修好的问题被改回去」。
      # 覆盖依赖安全基线（Mermaid / KaTeX / axios / Vue）与若干关键防护点，
      # 语法校验和打包校验都发现不了这类回归。
      - name: 安全不变量检查
        run: python3 .github/scripts/check_security_invariants.py .

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 PHP 与 Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: 环境信息
        run: |
          node -v
          npm -v
          php -v | head -1
          composer --version
          python3 --version

      # 元数据漂移与依赖安全：composer.json 声明的 PHP 版本应统一，
      # 且锁定的依赖不得带已知安全公告。
      # 注意：audit 必须带 --locked —— 这一步在 composer install 之前执行，
      # 没有 vendor/ 时 audit 会以「没有已安装包」为由失败。
      - name: 校验 composer 声明与依赖安全
        run: |
          composer validate --no-check-publish --no-interaction
          composer audit --locked --no-dev --no-interaction

      - name: 修正 composer.lock 的下载源
        run: |
          # 无论 lock 里的 dist 指向国内镜像（mirrors.cloud.tencent.com）
          # 还是 api.github.com 的 zipball，统一改从 codeload.github.com 拉取：
          # 前者在境外 runner 上会超时（curl error 28），后者易受未认证限流影响。
          # 仓库中的 composer.lock 保持原样，这里只改 runner 上的副本。
          python3 - <<'PY'
          import json

          REPOS = {
              "league/html-to-markdown": "thephpleague/html-to-markdown",
              "michelf/php-markdown": "michelf/php-markdown",
              "lurenjiasworld/wp-settings-api-class": "LuRenJiasWorld/wp-settings-api-class",
          }

          with open("composer.lock", encoding="utf-8") as fh:
              lock = json.load(fh)

          changed = 0
          for pkg in lock.get("packages", []):
              repo = REPOS.get(pkg["name"])
              dist = pkg.get("dist") or {}
              if not repo or not dist.get("reference"):
                  continue

              target = "https://codeload.github.com/%s/zip/%s" % (repo, dist["reference"])
              if dist.get("url") == target:
                  continue

              dist["url"] = target
              dist["type"] = "zip"
              dist["shasum"] = ""
              pkg["dist"] = dist
              changed += 1
              print("  替换 %s" % pkg["name"])

          with open("composer.lock", "w", encoding="utf-8") as fh:
              json.dump(lock, fh, indent=4, ensure_ascii=False)
              fh.write("\n")

          print("共替换 %d 个包" % changed)
          PY

      - name: 安装 PHP 依赖（生成 vendor/）
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: 构建前端产物
        run: |
          npm ci --no-audit --no-fund
          npm run build-prod

      - name: 构建 sm.ms 图片管理页（Vue 子项目）
        working-directory: src/Pages/page/sm-ms-management
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 编译语言包（.po → .mo）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext
          shopt -s nullglob
          for po in languages/*.po; do
            msgfmt -o "${po%.po}.mo" "$po"
            echo "已编译 $po"
          done
          ls -la languages/*.mo

      - name: PHP 语法校验
        run: |
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "语法错误：$f"
              php -l "$f"
              fail=1
            fi
          done < <(find . -name '*.php' \
                     -not -path './.git/*' \
                     -not -path '*/node_modules/*' \
                     -not -path './dist/*')
          echo "共检查 $count 个 PHP 文件"
          if [ "$fail" -ne 0 ]; then
            echo "PHP 语法校验未通过"
            exit 1
          fi
          echo "PHP 语法校验通过"

      - name: 打包可安装 zip
        run: |
          python3 .github/scripts/build_package.py \
            . \
            "dist/wp-editormd-${{ steps.ver.outputs.version }}.zip" \
            "${{ steps.ver.outputs.version }}"

      - name: 产物二次校验
        run: |
          ls -lh dist/
          python3 - <<'PY'
          import glob, zipfile
          path = glob.glob("dist/*.zip")[0]
          names = set(zipfile.ZipFile(path).namelist())
          required = [
              "wp-editormd/wp-editormd.php",
              "wp-editormd/uninstall.php",
              "wp-editormd/vendor/autoload.php",
              "wp-editormd/assets/Editormd/editormd.min.js",
              "wp-editormd/assets/Config/editormd-nonce.js",
              "wp-editormd/languages/editormd-zh_CN.mo",
              "wp-editormd/src/Pages/page/sm-ms-management/html/index.html",
          ]
          bad = [r for r in required if r not in names]
          print("zip 条目数:", len(names))
          for r in required:
              print(("  OK   " if r in names else "  MISS ") + r)
          if bad:
              raise SystemExit("产物校验失败，缺少：%s" % bad)
          print("产物校验通过")
          PY

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          name: WP Editor.md v${{ steps.ver.outputs.version }}
          tag_name: v${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: true
          body: |
            > **这是修改版（Modified Version），非上游原版。**
            > 上游 [LuRenJiasWorld/WP-Editor.md](https://github.com/LuRenJiasWorld/WP-Editor.md)
            > 最后版本为 10.2.1，长期未更新，并已于 2025-04-09 被 WordPress.org 以安全问题下架
            > （对应 **CVE-2025-31035**，Stored XSS，影响 `<= 10.2.1`）。本 Release 为在其基础上
            > 完成安全加固与新版兼容性适配的维护版本。

            ## 安装

            下载下方 `wp-editormd-${{ steps.ver.outputs.version }}.zip`，在 WordPress 后台
            「插件 → 安装插件 → 上传插件」中上传并启用即可。

            该 zip 已包含 `vendor/` 与全部前端编译产物，**可直接安装**。
            请勿使用 GitHub 自动生成的 Source code 压缩包 —— 它缺少这些运行期必需文件。

            ## 本版变更

            本版本的逐项变更见
            [CHANGELOG 的 ${{ steps.ver.outputs.version }} 条目](https://github.com/tjsky/WP-Editor.md/blob/master/CHANGELOG.md)；
            下方的自动生成说明列出了本次提交。

            ## 维护分支累计改动

            * 修复 KaTeX 公式渲染链路的**存储型 XSS**（与 CVE-2025-31035 同类）
            * 修复图片粘贴接口缺失权限与 CSRF 校验、任意文件写入
            * 修复 sm.ms 图床代理的 SSRF / 开放代理
            * 修复后台管理页渲染器的授权缺陷、设置项净化失效
            * 修复设置页选项互相覆盖导致思维导图失效的数据损坏缺陷
            * 修复代码块 / 行内代码中的 `$` 被误当公式渲染（10.4.0）
            * 修复块级公式被二次解析导致重复渲染（10.4.0）
            * 修复 xmlrpc 请求下 `IXR_Message` 类未找到（10.4.0，采纳上游 PR #546）
            * 新增可选的图片尺寸语法 `![alt](img.jpg =600x400)`（10.4.0）
            * 修复发布包缺少插件头字段导致后台不显示版本 / 作者 / 所需环境（10.4.1）
            * **Mermaid 8.4.8 → 10.9.8、KaTeX 0.11.1 → 0.19.0**，并强制 Mermaid `securityLevel=strict`（10.4.2）
            * 图片粘贴新增像素 / 内存预算与速率限制，上游超时 120s → 10s（10.4.2）
            * sm.ms 令牌移出浏览器、代理改为固定操作白名单；后台 AJAX 授权收紧（10.4.2）
            * 修复代码高亮控制台报 `Prism is not defined` 与 `/components/prism-*.min.js` 404（10.4.3）
            * 修复主题引入 Bootstrap 后编辑器工具栏按钮变透明并堆叠（10.4.3）
            * 修复后台回复框右半边空白、前台控制台每秒一次的 `wp is not defined`（10.4.3）
            * 修复访客评论的 Markdown 原样入库（评论转换开关此前默认关闭且与插件设置无联动）（10.4.4）
            * 修复 `html_decode` 关闭时引用与带标题的链接必然失效（10.4.4）
            * 修掉重复加载的两套 Prism，同类页面 Prism 脚本 302.5 KB → 24.2 KB（10.4.4）
            * 修复编辑器预览不认识图片尺寸语法、并会把普通文本当公式渲染（预览与发布结果不一致）（10.4.5）
            * 适配 WordPress 7.1 与 PHP 8.4，构建链可在现代 Node 下运行

            完整差异与逐项说明见仓库 [README](https://github.com/tjsky/WP-Editor.md#与上游的差异)
            与 [CHANGELOG](https://github.com/tjsky/WP-Editor.md/blob/master/CHANGELOG.md)。

            ## 授权

            本项目沿用上游的 **GNU GPL v3 or later**。
